app = 'octopoctosockto'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 6901
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
